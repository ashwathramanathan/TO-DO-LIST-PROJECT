{% extends "tasks/base.html" %}
{% block title %}Welcome{% endblock %}

{% block content %}
  <p class="date">{% now "l, j F" %}</p>
  <h1>Hey! What should I call you?</h1>

  <form method="post" class="add">
    {% csrf_token %}
    <input type="text" name="name" value="{{ name }}" maxlength="30"
           placeholder="Your name" autofocus required aria-label="Your name">
    <button class="btn" type="submit">Let's go</button>
  </form>
{% endblock %}
